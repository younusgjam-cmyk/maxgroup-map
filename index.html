<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MaxGroup Map - خريطة المواقع</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            height: 100vh;
            display: flex;
            color: #333;
        }

        .container {
            display: flex;
            width: 100%;
            height: 100%;
        }

        /* القائمة الجانبية */
        .sidebar {
            width: 300px;
            background: white;
            box-shadow: -2px 0 10px rgba(0,0,0,0.1);
            overflow-y: auto;
            padding: 20px;
        }

        .sidebar h2 {
            color: #667eea;
            margin-bottom: 20px;
            text-align: center;
            font-size: 22px;
        }

        .location-item {
            background: #f5f5f5;
            padding: 15px;
            margin-bottom: 10px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            border-right: 4px solid transparent;
        }

        .location-item:hover {
            background: #e8e8e8;
            border-right-color: #667eea;
            transform: translateX(-5px);
        }

        .location-item.active {
            background: #667eea;
            color: white;
            border-right-color: #764ba2;
        }

        .location-name {
            font-weight: bold;
            margin-bottom: 5px;
            font-size: 16px;
        }

        .location-city {
            font-size: 12px;
            opacity: 0.7;
        }

        /* منطقة المحتوى الرئيسية */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: white;
            margin: 20px;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            overflow: hidden;
        }

        /* الرأس */
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 32px;
            margin-bottom: 10px;
        }

        .header p {
            font-size: 14px;
            opacity: 0.9;
        }

        /* منطقة المعلومات */
        .info-section {
            flex: 1;
            padding: 40px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .location-details {
            background: #f9f9f9;
            padding: 30px;
            border-radius: 12px;
            max-width: 500px;
        }

        .info-label {
            color: #667eea;
            font-weight: bold;
            margin-top: 20px;
            font-size: 14px;
            text-transform: uppercase;
        }

        .info-value {
            font-size: 24px;
            font-weight: bold;
            color: #333;
            margin-top: 10px;
        }

        .map-placeholder {
            background: #e0e7ff;
            padding: 20px;
            border-radius: 8px;
            margin-top: 20px;
            font-size: 14px;
            color: #667eea;
        }

        .coordinates {
            background: white;
            padding: 15px;
            border-radius: 8px;
            margin-top: 15px;
            font-size: 12px;
            font-family: 'Courier New', monospace;
        }

        .coordinates-label {
            color: #666;
            margin-bottom: 8px;
        }

        .coordinates-value {
            color: #667eea;
            font-weight: bold;
        }

        /* شاشة البداية */
        .welcome {
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            color: #999;
        }

        .welcome-icon {
            font-size: 80px;
            margin-bottom: 20px;
        }

        .welcome h3 {
            font-size: 24px;
            margin-bottom: 10px;
        }

        /* الريسبونسيف */
        @media (max-width: 768px) {
            .container {
                flex-direction: column;
            }

            .sidebar {
                width: 100%;
                max-height: 200px;
                display: flex;
                overflow-x: auto;
                overflow-y: hidden;
                padding: 15px;
            }

            .location-item {
                flex-shrink: 0;
                width: 200px;
            }

            .main-content {
                margin: 0;
                border-radius: 0;
            }

            .info-section {
                padding: 20px;
            }

            .header h1 {
                font-size: 24px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- القائمة الجانبية -->
        <div class="sidebar">
            <h2>📍 الفروع</h2>
            <div id="locationsList"></div>
        </div>

        <!-- المحتوى الرئيسي -->
        <div class="main-content">
            <div class="header">
                <h1>🗺️ MaxGroup Map</h1>
                <p>تطبيق عرض المواقع والفروع</p>
            </div>

            <div class="info-section">
                <div id="content"></div>
            </div>
        </div>
    </div>

    <script>
        // بيانات الفروع
        const locations = [
            {
                id: 1,
                name: "الفرع الرئيسي",
                city: "دبي",
                address: "شارع الشيخ زايد",
                phone: "+971 4 123 4567",
                latitude: 25.2048,
                longitude: 55.2708,
                type: "الفرع الرئيسي"
            },
            {
                id: 2,
                name: "فرع أبو ظبي",
                city: "أبو ظبي",
                address: "جزيرة ياس",
                phone: "+971 2 555 6789",
                latitude: 24.4816,
                longitude: 54.3569,
                type: "فرع رئيسي"
            },
            {
                id: 3,
                name: "فرع الشارقة",
                city: "الشارقة",
                address: "منطقة الرقة",
                phone: "+971 6 123 8901",
                latitude: 25.3548,
                longitude: 55.4164,
                type: "فرع ثانوي"
            },
            {
                id: 4,
                name: "فرع عجمان",
                city: "عجمان",
                address: "منطقة النعيمية",
                phone: "+971 6 789 0123",
                latitude: 25.3856,
                longitude: 55.5165,
                type: "فرع ثانوي"
            },
            {
                id: 5,
                name: "فرع الفجيرة",
                city: "الفجيرة",
                address: "وسط البلد",
                phone: "+971 9 234 5678",
                latitude: 25.1243,
                longitude: 56.3540,
                type: "فرع ثانوي"
            }
        ];

        let selectedLocation = null;

        // دالة لعرض قائمة الفروع
        function renderLocationsList() {
            const listContainer = document.getElementById('locationsList');
            listContainer.innerHTML = locations.map(location => `
                <div class="location-item" onclick="selectLocation(${location.id})">
                    <div class="location-name">${location.name}</div>
                    <div class="location-city">📍 ${location.city}</div>
                </div>
            `).join('');
        }

        // دالة لاختيار موقع
        function selectLocation(id) {
            selectedLocation = locations.find(loc => loc.id === id);
            
            // تحديث الواجهة
            document.querySelectorAll('.location-item').forEach(item => {
                item.classList.remove('active');
            });
            event.target.closest('.location-item').classList.add('active');
            
            // عرض التفاصيل
            displayLocationDetails();
        }

        // دالة لعرض تفاصيل الموقع
        function displayLocationDetails() {
            const contentDiv = document.getElementById('content');
            
            if (!selectedLocation) {
                contentDiv.innerHTML = `
                    <div class="welcome">
                        <div class="welcome-icon">🗺️</div>
                        <h3>اختر فرعاً من القائمة</h3>
                        <p>لعرض تفاصيل الموقع والمعلومات</p>
                    </div>
                `;
                return;
            }

            contentDiv.innerHTML = `
                <div class="location-details">
                    <h2 style="color: #667eea; margin-bottom: 20px;">${selectedLocation.name}</h2>
                    
                    <div class="info-label">🏙️ المدينة</div>
                    <div class="info-value">${selectedLocation.city}</div>
                    
                    <div class="info-label">📍 العنوان</div>
                    <div class="info-value" style="font-size: 16px;">${selectedLocation.address}</div>
                    
                    <div class="info-label">📞 الهاتف</div>
                    <div class="info-value" style="font-size: 16px;">${selectedLocation.phone}</div>
                    
                    <div class="info-label">🏢 نوع الفرع</div>
                    <div class="info-value" style="font-size: 16px;">${selectedLocation.type}</div>
                    
                    <div class="coordinates">
                        <div class="coordinates-label">📍 الإحداثيات الجغرافية:</div>
                        <div class="coordinates-value">
                            العرض: ${selectedLocation.latitude.toFixed(4)}°<br>
                            الطول: ${selectedLocation.longitude.toFixed(4)}°
                        </div>
                    </div>
                    
                    <div class="map-placeholder">
                        🗺️ خريطة Google Maps ستظهر هنا قريباً
                    </div>
                </div>
            `;
        }

        // تهيئة التطبيق
        window.addEventListener('DOMContentLoaded', function() {
            renderLocationsList();
            displayLocationDetails();
        });
    </script>
</body>
</html>
